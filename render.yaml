services:
  - type: web
    runtime: static
    name: birch-demo-brand
    branch: main
    buildCommand: node brands/birch/build.mjs
    staticPublishPath: ./brands/birch/dist
    headers:
      - path: /.well-known/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /.well-known/*
        name: Content-Type
        value: application/json
